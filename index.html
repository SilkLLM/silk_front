<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="canonical" href="https://getsilkllm.com/" />
    <title>SilkLLM - One key for every AI model, and a marketplace that pays you back</title>
    <meta name="description" content="One API key across text, image, audio and video models from OpenAI, Anthropic, Google, DeepSeek and xAI. Bring your own provider key and earn credits when others use it. Start free, and keep your chats on your own device." />
    <meta name="keywords" content="LLM gateway, unified AI API, BYOK, AI marketplace, OpenAI, Anthropic, Gemini, DeepSeek, xAI, multimodal, image generation, text to speech" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SilkLLM" />
    <meta property="og:title" content="SilkLLM - One key for every AI model" />
    <meta property="og:description" content="Text, image, audio and video from every major provider through one key. Bring your own key and earn. Your chats stay on your device." />
    <meta property="og:url" content="https://getsilkllm.com/" />
    <meta property="og:image" content="https://getsilkllm.com/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SilkLLM - One key for every AI model" />
    <meta name="twitter:description" content="Text, image, audio and video through one key. Bring your own key and earn. Own your data." />
    <meta name="twitter:image" content="https://getsilkllm.com/logo.png" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Fonts: Inter + JetBrains Mono load via globals.css; Satoshi (display) via Fontshare -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500&display=swap" rel="stylesheet" />

    <!--
      Apply the stored theme before first paint. Without this the page renders in
      the default theme and then flips once the bundle executes.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("silk_theme");
          var dark = saved === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : saved !== "light";
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.dataset.theme = dark ? "dark" : "light";
          root.style.colorScheme = dark ? "dark" : "light";
          root.style.backgroundColor = dark ? "#0D0F10" : "#F6F5F2";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0D0F10" : "#F6F5F2");
        } catch (e) { /* private mode: fall through to the CSS default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
